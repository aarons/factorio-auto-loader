[entity-description]
auto-loader-chest=A per-surface supply chest. Stock it with fuel and ammo; every Auto-Loader chest on the same surface shares one inventory. Connect a circuit wire to read its contents.

[item-description]
auto-loader-chest=A per-surface supply chest. Stock it with fuel and ammo; every Auto-Loader chest on the same surface shares one inventory.

[mod-setting-name]
auto-loader-chest-slots=Auto-Loader: chest slots
auto-loader-entities-per-tick=Auto-Loader: entities per tick

[mod-setting-description]
auto-loader-chest-slots=Number of inventory slots on each Auto-Loader chest (1–1000). Startup setting: changing it requires restarting Factorio.
auto-loader-entities-per-tick=How many turrets and burners the Auto-Loader checks each tick, round-robin. Higher refills faster but costs more UPS. Takes effect immediately, no restart needed.
