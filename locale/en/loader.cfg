[entity-description]
auto-loader-chest=A per-surface supply chest. Stock it with fuel and ammo; every Auto-Loader chest on the same surface shares one inventory. Connect a circuit wire to read its contents.

[item-description]
auto-loader-chest=A per-surface supply chest. Stock it with fuel and ammo; every Auto-Loader chest on the same surface shares one inventory.

[mod-setting-name]
auto-loader-chest-slots=Auto-Loader: chest slots
auto-loader-chest-cost=Auto-Loader: chest cost
auto-loader-chest-stack-multiplier=Auto-Loader: inventory compression
auto-loader-entities-per-tick=Auto-Loader: entities per tick

[mod-setting-description]
auto-loader-chest-slots=Number of inventory slots on each Auto-Loader chest (1–1000). Startup setting: changing it requires restarting Factorio.
auto-loader-chest-cost=Recipe cost of the Auto-Loader chest. Inexpensive: 1 iron plate. Default: steel chest + electronic circuits. Expensive: also advanced circuits. Very expensive: also processing units. Startup setting: changing it requires restarting Factorio.
auto-loader-chest-stack-multiplier=Stack size multiplier for the Auto-Loader chest's inventory slots (1–100000). Each slot holds this many times the normal stack size. Startup setting: changing it requires restarting Factorio.

[string-mod-setting]
auto-loader-chest-cost-inexpensive=Inexpensive (1 iron plate)
auto-loader-chest-cost-default=Default
auto-loader-chest-cost-expensive=Expensive (+ advanced circuits)
auto-loader-chest-cost-very-expensive=Very expensive (+ processing units)
auto-loader-entities-per-tick=How many turrets and burners the Auto-Loader checks each tick, round-robin. Higher refills faster but costs more UPS. Takes effect immediately, no restart needed.
