[mod-setting-description]
auto-loader-chest-cost=Recipe cost. Cheat: 1 iron plate. Easy: same cost as an iron chest (8 iron plates). Normal: same cost as a passive provider chest. Expensive: same cost as an active provider chest.
auto-loader-chest-availability=When the recipe becomes available. Cheat: from the start, no research needed. Easy: after Electronics. Normal: after Construction robotics. Hard: after Logistic robotics.
auto-loader-chest-batch-size=How many consumer entities the mod processes each step. Higher = faster top-ups, slightly more UPS cost.
auto-loader-chest-tick-interval=How often (in ticks) the mod runs a processing step. Higher = lower UPS cost, slower top-ups.
auto-loader-chest-max-fill=How many of each item (per quality) to load into a consumer. Applies to all ammo and fuel inventories the same way; the game's own defaults like gun-turret = 10 and artillery = 5 are not used. Per-item overrides below take precedence.
auto-loader-chest-refill-trigger=Only refill a consumer once it has this many or fewer of an item (per quality). When it does, top it up to the max. Example: at 4 with max 10, a turret won't be touched until it falls to 4, then refills back to 10. If this matches or exceeds the max (or a per-item override), it's clamped to one less. Items that stack to 1 (nuclear fuel, uranium fuel cells) ignore this and always refill.
auto-loader-chest-insert-overrides=Per-item overrides for the max fill amount. Comma-separated list of item=count pairs. Example: coal=50,nutrients=100,nuclear-fuel=1. Set count to 0 to skip an item entirely.

