[mod-setting-description]
auto-loader-chest-slots=Number of inventory slots for each Auto-Loader chest (1–1000).
auto-loader-chest-stack-multiplier=Stack size multiplier for the Auto-Loader chest's inventory slots (1–100000). Each slot holds this many times the normal stack size.
auto-loader-chest-cost=Recipe cost of the Auto-Loader chest.\n\Easy: 1 iron plate.\n\nMedium: steel chest + electronic circuits.\n\nHard: also include advanced circuits.\n\nExtra Hard: also include processing units.

[string-mod-setting]
auto-loader-chest-cost-inexpensive=Easy (1 iron plate)
auto-loader-chest-cost-default=Medium (steel chest & electronic circuits)
auto-loader-chest-cost-expensive=Hard (+ advanced circuits)
auto-loader-chest-cost-very-expensive=Extra Hard (+ processing units)
auto-loader-entities-per-tick=How many turrets and burners the Auto-Loader checks each tick. Higher values will refill entities faster, but costs more UPS.
