[entity-description]
auto-loader-chest=Automatically refills ammo and fuel of nearby compatible entities on the same surface.

[mod-setting-name]
auto-loader-chest-batch-size=Auto-loader chest: consumers per tick step
auto-loader-chest-tick-interval=Auto-loader chest: ticks between steps
auto-loader-chest-default-max-insert=Auto-loader chest: default max items per consumer
auto-loader-chest-insert-overrides=Auto-loader chest: per-item max overrides

[mod-setting-description]
auto-loader-chest-batch-size=How many consumer entities the mod processes each step. Higher = faster top-ups, slightly more UPS cost.
auto-loader-chest-tick-interval=How often (in ticks) the mod runs a processing step. Higher = lower UPS cost, slower top-ups.
auto-loader-chest-default-max-insert=Default cap on how many of each item the mod keeps loaded in a consumer (per item, per quality). 0 disables loading any item without an explicit override.
auto-loader-chest-insert-overrides=Per-item overrides for the max insert cap. Comma-separated list of item=count pairs. Example: coal=50,nutrients=100,nuclear-fuel=1. Set count to 0 to skip an item entirely.
