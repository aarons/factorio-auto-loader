[entity-description]
auto-loader-chest=A per-surface supply chest. Stock it with fuel and ammo; every Auto-Loader chest on the same surface shares one inventory. Connect a circuit wire to read its contents.

[item-description]
auto-loader-chest=A per-surface supply chest. Stock it with fuel and ammo; every Auto-Loader chest on the same surface shares one inventory.

