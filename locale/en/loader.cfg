[mod-setting-description]
auto-loader-chest-cost=Recipe cost. Cheat: 1 iron plate. Easy: same cost as an iron chest (8 iron plates). Normal: same cost as a passive provider chest. Expensive: same cost as an active provider chest.
auto-loader-chest-availability=When the recipe becomes available. Cheat: from the start, no research needed. Easy: after Electronics. Normal: after Construction robotics. Hard: after Logistic robotics.
auto-loader-chest-batch-size=How many consumer entities the mod processes each step. Higher = faster top-ups, slightly more UPS cost.
auto-loader-chest-tick-interval=How often (in ticks) the mod runs a processing step. Higher = lower UPS cost, slower top-ups.
auto-loader-chest-max-fill=Maximum fill size per item (per quality) for any consumer. A consumer is topped back up to this amount whenever it has fewer. Applies to all ammo and fuel inventories the same way; the game's own defaults like gun-turret = 10 and artillery = 5 are not used. Items with smaller stack sizes (e.g. nuclear fuel) are naturally capped by stack size.
auto-loader-chest-default-fuel-strategy=Default quality strategy applied to newly-encountered fuel items. Existing entries keep their per-item setting. Lowest-quality-first burns the cheap stuff first.
auto-loader-chest-default-ammo-strategy=Default quality strategy applied to newly-encountered ammo items. Existing entries keep their per-item setting. Highest-quality-first uses your premium ammo first.

